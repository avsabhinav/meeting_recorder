name: ci

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check mr tests

      - name: Pytest
        run: pytest

      - name: Build mr-capture
        run: cd capture && ./build.sh

      - name: Build Oatmeal and run tests
        run: cd menu-bar && ./build.sh && swift test --disable-sandbox
