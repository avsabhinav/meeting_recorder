[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-recorder"
version = "0.1.0"
description = "Local-first macOS 1:1 call recorder + transcriber that writes an attributed Markdown transcript."
requires-python = ">=3.12"
dependencies = [
  "mlx-whisper>=0.4",
  "typer>=0.12",
  "soundfile>=0.12",
  "rapidfuzz>=3.0",
]

[project.scripts]
mr = "mr.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["mr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
